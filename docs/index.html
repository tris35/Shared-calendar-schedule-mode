<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
// 外观：深色（默认）/ 浅色 / 自动（跟手机）。每个人自己的装置记住
(function () {
  var mq = window.matchMedia ? matchMedia("(prefers-color-scheme: light)") : null;
  function apply() {
    var p = "dark"; try { p = localStorage.getItem("theme") || "dark"; } catch (e) {}
    var t = p === "auto" ? (mq && mq.matches ? "light" : "dark") : p;
    document.documentElement.dataset.theme = t;
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === "light" ? "#f3f6fb" : "#050b1f";
  }
  apply(); window.applyTheme = apply;
  if (mq && mq.addEventListener) mq.addEventListener("change", apply);
  window.addEventListener("storage", function (e) { if (e.key === "theme") apply(); });
})();
</script>
<meta name="theme-color" content="#050b1f">
<title>The Legend Calendar</title>
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">

</head>

<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<dialog id="sheet" class="sheet"></dialog>

<script type="module" src="v2.js?v=240"></script>
</body>
</html>
